name: Checks

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    env:
      BLF_REQUIRE_GUI: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Check (Windows)
        if: runner.os == 'Windows'
        run: python scripts/check.py
      - name: Check (Linux with GUI display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/check.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest' && matrix.python == '3.11'
        with:
          name: blf-to-mat-preview
          path: dist/*
          if-no-files-found: error
